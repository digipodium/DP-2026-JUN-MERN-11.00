<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <link
        href="https://fonts.googleapis.com/css?family=Roboto:100,200,300,regular,500,600,700,800,900,100italic,200italic,300italic,italic,500italic,600italic,700italic,800italic,900italic"
        rel="stylesheet" />

    <style>
        * {
            font-family: Roboto;
        }

        .card {
            /* border: 2px solid red; */
            width: 20%;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 3px 3px 5px 0 #0000005a;
            background-color: white;
        }

        body {
            background-color: #ccc;
            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;

            /* background-image: linear-gradient(90deg, #ffffd6, #d6d6ff, #ffbdbd); */

            background-image: url('https://images.unsplash.com/photo-1483794344563-d27a8d18014e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8bWluaW1hbCUyMHBsYW50fGVufDB8fDB8fHww');
            background-size: cover;
            background-position: bottom;

        }

        .form-title {
            text-align: center;
        }

        .text-input {
            display: block;
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            margin-bottom: 20px;
            margin-top: 5px;
            border-radius: 5px;
            border: 1px solid black;
        }

        .btn-submit {
            background-color: blueviolet;
            color: white;
            padding: 15px;
            display: block;
            width: 100%;
            border-radius: 5px;
            border: none;
        }

        .link {
            display: block;
            color: blueviolet;
            text-decoration: none;
        }

        .forgot-link {
            text-align: right;
            margin-bottom: 30px;
        }

        .signup-link {
            text-align: center;
            margin-top: 30px;
        }
    </style>

</head>

<body>

    <div class="card">
        <h2 class="form-title">Login Form</h2>
        <form>
            <label for="">Email Address</label>
            <input type="email" class="text-input">

            <label for="">Password</label>
            <input type="password" class="text-input">

            <a href="#" class="link forgot-link">Forgot Password</a>

            <button class="btn-submit">Submit</button>

            <a href="#" class="link signup-link">Signup Now</a>

        </form>

    </div>

</body>

</html>
